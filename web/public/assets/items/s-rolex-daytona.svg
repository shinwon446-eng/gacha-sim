<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Rolex Daytona 116500LN - 42,000 USDT">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b1"/>
      <feGaussianBlur stdDeviation="4" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="disc" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#1E1E1E" stop-opacity="0.92"/>
      <stop offset="70%" stop-color="#0E0E0E" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0.82"/>
    </radialGradient>
  </defs>
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- 어두운 반투명 원형 배경 -->
    <circle cx="400" cy="400" r="330" fill="url(#disc)"/>
    <!-- 등급색 글로우 외곽선 -->
    <circle cx="400" cy="400" r="330" fill="none" stroke="#FF4655" stroke-width="6" filter="url(#glow)" opacity="0.95"/>
    <circle cx="400" cy="400" r="318" fill="none" stroke="#FF4655" stroke-width="1" opacity="0.35"/>
    <!-- 등급 -->
    <text x="400" y="248" text-anchor="middle" font-size="30" font-weight="700" letter-spacing="8" fill="#FF4655">TIER S</text>
    <!-- 이름 -->
    <text x="400" y="372" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">Rolex Daytona</text>
    <text x="400" y="434" text-anchor="middle" font-size="52" font-weight="700" fill="#FFFFFF">116500LN</text>
    <!-- 밸류 -->
    <text x="400" y="500" text-anchor="middle" font-size="40" font-weight="600" fill="#FF4655" font-family="'JetBrains Mono', Consolas, monospace">42,000 USDT</text>
    <!-- 아이디 -->
    <text x="400" y="600" text-anchor="middle" font-size="18" letter-spacing="3" fill="#8A8A8A">S-ROLEX-DAYTONA</text>
  </g>
</svg>
